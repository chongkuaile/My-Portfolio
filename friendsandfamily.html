<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carlos Blanca | Friends and Family</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.bar { padding: clamp(0.6rem, 1.8vh, 1.35rem) 0; flex-shrink: 0; }
.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
}
.brand-logo {
  width: clamp(2rem, 3.8vh, 2.4rem);
  height: clamp(2rem, 3.8vh, 2.4rem);
  object-fit: contain;
  display: block;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 10px rgba(91, 63, 209, 0.25));
}
footer { padding: clamp(0.45rem, 1.4vh, 1rem); font-size: clamp(0.72rem, 1.45vh, 0.85rem); flex-shrink: 0; }

/* the photos reach the sides on this page, so the circuit lines and symbols stay hidden */
.trace, .glyph { display: none !important; }

/* Layout: a title row, then four big photo columns that fill the rest of the screen */
.ff {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: clamp(0.6rem, 1.8vh, 1.4rem);
  width: calc(100% - 7rem);
  max-width: 1800px;
  margin: 0 auto;
  padding: clamp(0.4rem, 1.4vh, 1.25rem) 0;
}
.ff-top {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 0.25rem 2rem;
}
.ff-eyebrow {
  display: block;
  margin-bottom: 0.2rem;
  font: 500 clamp(0.8rem, 1.7vh, 1rem) var(--mono);
  color: var(--signal);
}
.ff-top h1 {
  margin: 0;
  font-size: clamp(2rem, 5.4vh, 3.5rem);
  line-height: 1.08;
  letter-spacing: -0.03em;
  font-weight: 600;
}
.ff-top h1 span {
  background: linear-gradient(100deg, #6A47E0, #2F7CF6);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.ff-top p {
  margin: 0;
  font-size: clamp(1rem, 2.3vh, 1.35rem);
  color: var(--muted);
}

.ff-gallery {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: minmax(0, 1fr);
  gap: clamp(0.75rem, 1.6vw, 1.5rem);
}
.ff-card {
  display: flex;
  flex-direction: column;
  gap: clamp(0.5rem, 1.3vh, 0.9rem);
  min-height: 0;
  margin: 0;
  animation: fade-up 0.7s ease backwards;
}
.ff-card:nth-child(1) { animation-delay: 0.1s; }
.ff-card:nth-child(2) { animation-delay: 0.2s; }
.ff-card:nth-child(3) { animation-delay: 0.3s; }
.ff-card:nth-child(4) { animation-delay: 0.4s; }

/* the frame shows the file name until the photo is added */
.ff-frame {
  position: relative;
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: rgba(124, 92, 255, 0.06);
  border: 2px dashed var(--line);
  border-radius: 20px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.ff-ph {
  font: 500 clamp(0.8rem, 1.7vh, 1rem) var(--mono);
  color: var(--accent);
}
.ff-frame img {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 30%;
}
.ff-frame:has(img) {
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: 0 20px 40px -24px rgba(91, 63, 209, 0.55);
}
.ff-card:hover .ff-frame {
  transform: translateY(-4px);
  box-shadow: 0 26px 46px -24px rgba(91, 63, 209, 0.7);
}

/* captions: edit the text in the HTML */
.ff-card figcaption {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: clamp(1.05rem, 2.5vh, 1.5rem);
  font-weight: 500;
  line-height: 1.25;
}
.ff-card figcaption::before {
  content: "//";
  font: 500 0.85em var(--mono);
  color: var(--signal);
}

@media (max-width: 819px) {
  .ff { width: min(1080px, 100% - 2rem); gap: clamp(0.4rem, 1.3dvh, 0.9rem); }
  .ff-top h1 { font-size: clamp(1.5rem, 4dvh, 2.1rem); }
  .ff-top p { font-size: clamp(0.8rem, 1.8dvh, 1rem); }
  .ff-gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 0.7rem;
  }
  .ff-frame { border-radius: 14px; }
  .ff-card figcaption { font-size: clamp(0.85rem, 1.9dvh, 1.05rem); }
}
/* very short screens: let the page scroll instead of squeezing the photos */
@media (max-height: 520px) {
  html, body { height: auto; max-height: none; overflow: auto; }
  .ff-gallery { min-height: 26rem; }
}
@media (prefers-reduced-motion: reduce) {
  .ff-card { animation: none; }
  .ff-frame { transition: none; }
}
</style>
</head>
