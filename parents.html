<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carlos Blanca | Friends and Family</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
html, body {
  min-height: 100dvh;
  overflow-x: hidden;
}
@media (min-width: 820px) and (min-height: 640px) {
  html, body { height: 100dvh; max-height: 100dvh; overflow: hidden; }
}
@media (max-width: 819px) and (min-height: 560px) {
  html, body { height: 100dvh; max-height: 100dvh; overflow: hidden; }
}

.bar { padding: clamp(0.6rem, 1.8vh, 1.35rem) 0; flex-shrink: 0; }
footer { padding: clamp(0.45rem, 1.4vh, 1rem); font-size: clamp(0.72rem, 1.45vh, 0.85rem); flex-shrink: 0; }

.eyebrow {
  display: block;
  margin-bottom: clamp(0.25rem, 0.8vh, 0.65rem);
  font: 500 clamp(0.75rem, 1.5vh, 0.88rem) var(--mono);
  color: var(--signal);
}
.side h1 {
  font-size: clamp(1.5rem, 3.4vh, 2.25rem);
  line-height: 1.12;
  margin: 0 0 clamp(0.35rem, 1vh, 0.75rem);
}
.side h1 span {
  background: linear-gradient(100deg, #6A47E0, #2F7CF6);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.side p {
  font-size: clamp(0.82rem, 1.65vh, 0.98rem);
  line-height: 1.5;
}

.page {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 15.5rem minmax(0, 1fr);
  gap: clamp(1.5rem, 3.5vw, 3.5rem);
  align-content: center;
  align-items: start;
  width: min(1080px, 100% - 3rem);
  margin: 0 auto;
  padding: clamp(0.4rem, 1.2vh, 1.25rem) 0;
}
.side { position: static; }

.gallery {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: clamp(0.6rem, 1.6vw, 1.1rem);
  height: clamp(15rem, 62dvh, 32rem);
  min-height: 0;
}
.photo {
  display: flex;
  flex-direction: column;
  gap: clamp(0.35rem, 0.9vh, 0.6rem);
  min-height: 0;
  margin: 0;
  animation: fade-up 0.7s ease backwards;
}
.photo:nth-child(1) { animation-delay: 0.1s; }
.photo:nth-child(2) { animation-delay: 0.2s; }
.photo:nth-child(3) { animation-delay: 0.3s; }
.photo:nth-child(4) { animation-delay: 0.4s; }
.frame {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font: 500 clamp(0.64rem, 1.3vh, 0.76rem) var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent);
  background: rgba(124,92,255,.06);
  border: 1.5px dashed var(--line);
  border-radius: 14px;
}
.frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo figcaption {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: clamp(0.84rem, 1.7vh, 1rem);
  font-weight: 500;
}
.photo figcaption::before {
  content: "//";
  font: 500 clamp(0.74rem, 1.5vh, 0.9rem) var(--mono);
  color: var(--signal);
}

@media (min-width: 820px) and (max-height: 639px) {
  .page { align-content: start; padding: 1.25rem 0 1.5rem; }
}

@media (max-width: 819px) {
  .bar { width: min(1080px, 100% - 2rem); padding: clamp(0.4rem, 1.2dvh, 0.75rem) 0; }
  footer {
    padding: clamp(0.3rem, 1dvh, 0.6rem) 1rem calc(clamp(0.3rem, 1dvh, 0.6rem) + env(safe-area-inset-bottom, 0px));
    font-size: 0.72rem;
  }
  .page {
    display: flex;
    flex-direction: column;
    gap: clamp(0.4rem, 1.3dvh, 0.9rem);
    width: min(1080px, 100% - 2rem);
    padding: clamp(0.25rem, 0.8dvh, 0.6rem) 0;
    overflow-x: hidden;
    overflow-y: auto;
  }
  .side {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.15rem 0.6rem;
    padding-bottom: clamp(0.3rem, 0.9dvh, 0.6rem);
    border-bottom: 1px solid var(--line);
  }
  .side .eyebrow { margin: 0; font-size: 0.75rem; }
  .side h1 { font-size: clamp(1.25rem, 3dvh, 1.6rem); margin: 0; }
  .side p { width: 100%; margin: 0; font-size: clamp(0.72rem, 1.6dvh, 0.88rem); line-height: 1.4; }
  .gallery {
    flex: 1;
    height: auto;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 0.6rem;
  }
  .frame { border-radius: 12px; }
  .photo figcaption { font-size: clamp(0.76rem, 1.6dvh, 0.9rem); }
}
@media (max-width: 819px) and (max-height: 700px) {
  .side p { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .photo { animation: none; }
}
</style>
</head>
