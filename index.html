<style>
/* Lock viewport height so the page never scrolls */
html, body {
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
}

/* Balanced header and footer */
.bar {
  padding: clamp(0.6rem, 1.8vh, 1.35rem) 0;
  flex-shrink: 0;
}
footer {
  padding: clamp(0.45rem, 1.4vh, 1rem);
  font-size: clamp(0.72rem, 1.45vh, 0.85rem);
  flex-shrink: 0;
}

/* Flex container for main */
.home {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.links {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(0.5rem, 1.2vw, 0.75rem);
  margin: clamp(0.75rem, 2.2vh, 1.75rem) 0 0;
  animation: fade-up .8s ease 1.05s backwards;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: .55rem;
  padding: clamp(0.5rem, 1.2vh, 0.7rem) clamp(0.95rem, 2vw, 1.25rem);
  font-weight: 500;
  font-size: clamp(0.85rem, 1.65vh, 1rem);
  color: var(--ink);
  border: 2px solid transparent;
  border-radius: 14px;
  background: linear-gradient(#fff,#fff) padding-box,
              linear-gradient(120deg,#7c5cff 0%,#2f7cf6 55%,#b28cff 100%) border-box;
  transition: transform .25s ease, box-shadow .25s ease;
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px -12px rgba(91,63,209,.6);
}
.btn.fill {
  color: #fff;
  background: linear-gradient(120deg,#7c5cff,#2f7cf6) border-box;
}
.btn svg {
  width: 1.15rem;
  height: 1.15rem;
  flex: none;
}
.btn .gh {
  fill: currentColor;
}
.btn .ml {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.lead:empty {
  display: none;
}

/* Hero: text + photo share one centered container, aligned with the header */
.hero {
  position: relative;
  isolation: isolate;
}

/* Cutout photo: no frame, stands on the footer line, glow bleeds behind the text */
.photo {
  background: none !important;
  border: 0 !important;
  box-shadow: none !important;
  outline: 0 !important;
}
.photo::before, .photo::after {
  display: none !important;
}
.cutout {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
/* soft violet / blue / silver glow that spans photo and headline so they read as one scene */
.cutout::before {
  content: "";
  position: absolute;
  inset: -4% -22% 0 -85%;
  z-index: -1;
  background:
    radial-gradient(30% 46% at 66% 42%, rgba(124,92,255,.34), transparent 72%),
    radial-gradient(26% 40% at 82% 60%, rgba(47,124,246,.26), transparent 74%),
    radial-gradient(30% 40% at 46% 66%, rgba(178,140,255,.22), transparent 74%),
    radial-gradient(44% 26% at 66% 100%, rgba(190,196,218,.55), transparent 76%);
  filter: blur(20px);
  opacity: .95;
  transition: opacity .5s ease, transform .5s ease;
  pointer-events: none;
}
.cutout img {
  display: block;
  width: auto !important;
  height: auto !important;
  max-width: 100%;
  max-height: min(100%, 88vh);
  aspect-ratio: auto !important;
  object-fit: contain !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  background: none !important;
  filter: drop-shadow(0 10px 24px rgba(91,63,209,.18));
  transform-origin: 50% 100%;
  transition: transform .5s ease, filter .5s ease;
}
.cutout:hover img {
  transform: scale(1.025);
  filter: drop-shadow(0 12px 30px rgba(91,63,209,.32));
}
.cutout:hover::before {
  opacity: 1;
  transform: scale(1.04);
}

/* Desktop layout (>= 820px) */
@media (min-width: 820px) {
  .hero {
    flex: 1;
    min-height: 0;
    height: 100%;
    width: min(1080px, 100% - 3rem);
    margin: 0 auto;
    padding: 0;
    gap: clamp(1rem, 3vw, 3rem);
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: end;
  }
  .hero > div {
    padding: 0 0 clamp(1.25rem, 9vh, 6rem) 0;
  }
  .hero h1 {
    font-size: clamp(2.25rem, min(5vw, 7.5vh), 4.25rem);
  }
  .role {
    margin-top: clamp(0.6rem, 1.6vh, 1rem);
    font-size: clamp(1.05rem, 2.2vh, 1.35rem);
  }
  .photo {
    display: flex;
    min-height: 0;
    justify-self: stretch;
    align-self: stretch;
    width: calc(100% + clamp(0rem, 3vw, 3rem));
    height: 100%;
    margin: 0 calc(-1 * clamp(0rem, 3vw, 3rem)) 0 0;
  }
  .cutout {
    flex: 1;
    min-height: 0;
  }
}

/* Mobile & small tablet layout (< 820px) - centered cohesive unit, no voids */
@media (max-width: 819px) {
  .bar {
    width: min(1080px, 100% - 2rem);
  }
  .hero {
    flex: 1;
    min-height: 0;
    width: min(1080px, 100% - 2rem);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: clamp(0.75rem, 2.2vh, 1.5rem);
    padding: clamp(0.25rem, 1vh, 0.75rem) 0 0;
  }
  .hero > div {
    width: 100%;
    max-width: 28rem;
  }
  .hero h1 {
    font-size: clamp(1.85rem, min(8vw, 4.8vh), 2.75rem);
    line-height: 1.06;
  }
  .role {
    margin-top: clamp(0.4rem, 1.2vh, 0.75rem);
    font-size: clamp(0.95rem, 2vh, 1.15rem);
  }
  .links {
    justify-content: center;
    margin-top: clamp(0.75rem, 2vh, 1.25rem);
  }
  .photo {
    display: flex;
    margin: 0;
    min-height: 0;
    width: min(86vw, 22rem);
    height: clamp(12.5rem, 44dvh, 22rem);
    flex: none;
  }
  .cutout {
    flex: 1;
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  .cutout::before {
    inset: 0 -12% 0 -12%;
  }
}
</style>
</head>
