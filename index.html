<style>
/* Lock viewport height so the page never scrolls */
html, body {
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
}

/* Balanced header and footer */
.bar {
  padding: clamp(0.6rem, 1.8vh, 1.35rem) 0;
  flex-shrink: 0;
}
footer {
  padding: clamp(0.45rem, 1.4vh, 1rem);
  font-size: clamp(0.72rem, 1.45vh, 0.85rem);
  flex-shrink: 0;
}

/* Flex container for main */
.home {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.links {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(0.5rem, 1.2vw, 0.75rem);
  margin: clamp(0.75rem, 2.2vh, 1.75rem) 0 0;
  animation: fade-up .8s ease 1.05s backwards;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: .55rem;
  padding: clamp(0.5rem, 1.2vh, 0.7rem) clamp(0.95rem, 2vw, 1.25rem);
  font-weight: 500;
  font-size: clamp(0.85rem, 1.65vh, 1rem);
  color: var(--ink);
  border: 2px solid transparent;
  border-radius: 14px;
  background: linear-gradient(#fff,#fff) padding-box,
              linear-gradient(120deg,#7c5cff 0%,#2f7cf6 55%,#b28cff 100%) border-box;
  transition: transform .25s ease, box-shadow .25s ease;
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px -12px rgba(91,63,209,.6);
}
.btn.fill {
  color: #fff;
  background: linear-gradient(120deg,#7c5cff,#2f7cf6) border-box;
}
.btn svg {
  width: 1.15rem;
  height: 1.15rem;
  flex: none;
}
.btn .gh {
  fill: currentColor;
}
.btn .ml {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.lead:empty {
  display: none;
}

/* Desktop layout (>= 820px) */
@media (min-width: 820px) {
  .hero {
    flex: 1;
    min-height: 0;
    height: 100%;
    width: 100%;
    margin: 0;
    gap: 2rem;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 0 1.5rem clamp(0.5rem, 2vh, 1.5rem) 0;
  }
  .hero > div {
    padding-left: max(1.5rem, calc((100vw - 1080px) / 2));
  }
  .hero h1 {
    font-size: clamp(2.25rem, min(5.5vw, 8vh), 4.75rem);
  }
  .role {
    margin-top: clamp(0.6rem, 1.6vh, 1rem);
    font-size: clamp(1.05rem, 2.2vh, 1.35rem);
  }
  .photo, .frame, .mat {
    display: flex;
    min-height: 0;
  }
  .photo {
    justify-self: stretch;
    align-self: stretch;
    width: 100%;
    height: 100%;
  }
  .frame {
    flex: 1;
  }
  .mat {
    flex: 1;
    position: relative;
  }
  .mat img {
    position: absolute;
    inset: 6px;
    width: calc(100% - 12px);
    height: calc(100% - 12px);
    aspect-ratio: auto;
    object-position: 50% 25%;
  }
}

@media (min-width: 1200px) {
  .hero {
    padding-right: 4rem;
  }
}

/* Mobile & small tablet layout (< 820px) - centered cohesive unit, no voids */
@media (max-width: 819px) {
  .bar {
    width: min(1080px, 100% - 2rem);
  }
  .hero {
    flex: 1;
    min-height: 0;
    width: min(1080px, 100% - 2rem);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: clamp(1rem, 2.8vh, 1.85rem);
    padding: clamp(0.25rem, 1vh, 0.75rem) 0;
  }
  .hero > div {
    width: 100%;
    max-width: 28rem;
  }
  .hero h1 {
    font-size: clamp(1.85rem, min(8vw, 4.8vh), 2.75rem);
    line-height: 1.06;
  }
  .role {
    margin-top: clamp(0.4rem, 1.2vh, 0.75rem);
    font-size: clamp(0.95rem, 2vh, 1.15rem);
  }
  .links {
    justify-content: center;
    margin-top: clamp(0.75rem, 2vh, 1.25rem);
  }
  .photo {
    justify-self: center;
    height: clamp(12.5rem, 42dvh, 21rem);
    width: auto;
    max-width: min(86vw, 18rem);
    aspect-ratio: 3 / 4;
    display: flex;
    min-height: 0;
  }
  .frame, .mat {
    display: flex;
    flex: 1;
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  .mat img {
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
    object-fit: cover;
    object-position: 50% 25%;
  }
}
</style>
</head>
