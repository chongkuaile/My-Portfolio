<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Lock viewport height so the page never scrolls */
html, body {
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
}

/* Balanced header and footer + Top-left UC Seal logo */
.bar {
  width: min(1180px, 100% - 3rem) !important;
  padding: clamp(0.5rem, 1.5vh, 1.15rem) 0 !important;
  flex-shrink: 0;
  z-index: 10;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
}
.brand-logo {
  width: clamp(2rem, 3.8vh, 2.4rem);
  height: clamp(2rem, 3.8vh, 2.4rem);
  object-fit: contain;
  display: block;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 10px rgba(91, 63, 209, 0.25));
}

footer {
  position: relative;
  z-index: 5;
  padding: clamp(0.4rem, 1.2vh, 0.85rem) !important;
  font-size: clamp(0.72rem, 1.4vh, 0.85rem) !important;
  background: rgba(243, 244, 250, 0.85);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  flex-shrink: 0;
}

/* Main wrapper */
.home {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* Eyebrow Status Badge */
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.35rem 0.9rem;
  margin-bottom: clamp(0.6rem, 1.5vh, 1rem);
  border-radius: 999px;
  font: 500 clamp(0.72rem, 1.4vh, 0.84rem) var(--mono);
  color: var(--accent);
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(106, 71, 224, 0.25);
  box-shadow: 0 8px 20px -12px rgba(91, 63, 209, 0.35);
  white-space: nowrap;
  animation: fade-up 0.7s ease 0.05s backwards;
}
.hero-badge .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--signal);
  box-shadow: 0 0 8px var(--signal);
  flex-shrink: 0;
  animation: blink 1.8s ease-in-out infinite;
}

/* Typography & Bio */
.hero h1 .greeting {
  display: block;
  font-size: 0.46em;
  font-weight: 500;
  letter-spacing: -0.015em;
  margin-bottom: 0.12em;
}
.role {
  margin: clamp(0.55rem, 1.5vh, 1rem) 0 0 !important;
  font-size: clamp(1.05rem, 2.2vh, 1.35rem) !important;
  font-weight: 500;
  color: var(--accent);
  animation: fade-up .8s ease .85s backwards;
}
.lead {
  max-width: 36rem !important;
  margin: clamp(0.5rem, 1.3vh, 0.9rem) 0 0 !important;
  font-size: clamp(0.88rem, 1.7vh, 1.05rem) !important;
  line-height: 1.55;
  color: var(--muted);
  animation: fade-up .8s ease .95s backwards;
}

/* Action Buttons - Forced horizontal row */
.links {
  display: flex !important;
  flex-direction: row !important;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem !important;
  margin: clamp(0.9rem, 2.2vh, 1.6rem) 0 0 !important;
  animation: fade-up .8s ease 1.05s backwards;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: .55rem;
  padding: clamp(0.55rem, 1.25vh, 0.75rem) clamp(1rem, 1.8vw, 1.3rem);
  font-weight: 500;
  font-size: clamp(0.85rem, 1.6vh, 0.98rem);
  color: var(--ink);
  border: 2px solid transparent;
  border-radius: 14px;
  white-space: nowrap;
  background: linear-gradient(#fff, #fff) padding-box,
              linear-gradient(120deg, #7c5cff 0%, #2f7cf6 55%, #b28cff 100%) border-box;
  transition: transform .25s ease, box-shadow .25s ease;
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px -12px rgba(91, 63, 209, .6);
}
.btn.fill {
  color: #fff;
  background: linear-gradient(120deg, #7c5cff, #2f7cf6) border-box;
}
.btn svg {
  width: 1.15rem;
  height: 1.15rem;
  flex: none;
}
.btn .gh { fill: currentColor; }
.btn .ml {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- Elevated Cutout + Backdrop Halo (No bottom oval gradient) ---------- */
.photo {
  background: none !important;
  border: 0 !important;
  box-shadow: none !important;
  outline: 0 !important;
  margin: 0 !important;
  animation: photo-in 1s cubic-bezier(.2, .8, .2, 1) .35s backwards;
}
.photo::before, .photo::after {
  display: none !important;
}
.cutout {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

/* Soft ambient backdrop glow behind upper body */
.cutout::before {
  content: "";
  position: absolute;
  width: 145%;
  height: 125%;
  left: -22%;
  bottom: 6%;
  z-index: -2;
  background:
    radial-gradient(closest-side at 50% 44%, rgba(124, 92, 255, .34), rgba(47, 124, 246, .15) 60%, transparent 100%);
  pointer-events: none;
}

/* Raised backdrop halo circle behind head & shoulders */
.cutout::after {
  content: "";
  position: absolute;
  width: clamp(20rem, 56dvh, 33rem);
  aspect-ratio: 1;
  bottom: 20%;
  z-index: -1;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.82), rgba(124, 92, 255, 0.18) 56%, rgba(47, 124, 246, 0.25) 100%);
  border: 1.5px solid rgba(124, 92, 255, 0.3);
  box-shadow:
    inset 0 0 46px rgba(124, 92, 255, 0.18),
    0 28px 60px -20px rgba(91, 63, 209, 0.34);
  translate: calc(var(--px, 0) * -6px) calc(var(--py, 0) * -6px);
  transition: translate 0.3s ease-out, transform 0.5s ease, border-color 0.4s ease;
  pointer-events: none;
}

/* Desktop layout (>= 820px) */
@media (min-width: 820px) {
  .hero {
    flex: 1;
    min-height: 0;
    height: 100%;
    width: min(1180px, 100% - 3rem) !important;
    margin: 0 auto !important;
    padding: 0 !important;
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between !important;
    gap: 1.5rem !important;
  }
  .hero > .hero-copy {
    flex: 0 0 54% !important;
    width: 54% !important;
    max-width: 54% !important;
    padding: 0 0 clamp(1rem, 3vh, 2rem) 0 !important;
    margin: 0 !important;
    z-index: 3;
  }
  .hero h1 {
    font-size: clamp(2.5rem, min(4.3vw, 6.8vh), 4rem) !important;
    line-height: 1.06 !important;
  }
  .hero > .photo {
    flex: 0 0 44% !important;
    width: 44% !important;
    max-width: 44% !important;
    height: 100% !important;
    max-height: none !important;
    align-self: stretch !important;
    display: flex !important;
    z-index: 1;
  }
  .cutout {
    width: 100%;
    height: 100%;
  }
  /* Elevated cutout with a smooth fade at the bottom edge */
  .cutout img {
    position: absolute !important;
    bottom: 13% !important;
    left: 50% !important;
    z-index: 1;
    width: auto !important;
    max-width: none !important;
    height: 82dvh !important;
    max-height: none !important;
    object-fit: contain !important;
    object-position: bottom center !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    background: none !important;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 84%, rgba(0,0,0,0.45) 94%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 84%, rgba(0,0,0,0.45) 94%, transparent 100%);
    filter: drop-shadow(0 18px 36px rgba(28, 27, 56, .24)) drop-shadow(0 0 22px rgba(124, 92, 255, .28));
    transform-origin: 50% 100% !important;
    transform: translateX(-48%) scale(1.15) !important;
    translate: calc(var(--px, 0) * 8px) 0;
    transition: transform .5s cubic-bezier(.22, 1, .36, 1), translate .25s ease-out, filter .5s ease;
  }
  .cutout:hover img {
    transform: translateX(-48%) scale(1.18) translateY(-4px) !important;
    filter: drop-shadow(0 22px 42px rgba(91, 63, 209, .38));
  }
}

/* Mobile & small tablet layout (< 820px) */
@media (max-width: 819px) {
  .bar {
    width: min(1080px, 100% - 2rem) !important;
  }
  .hero {
    flex: 1;
    min-height: 0;
    height: 100%;
    width: min(1080px, 100% - 2rem) !important;
    margin: 0 auto !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: space-between !important;
    text-align: center;
    gap: 0.35rem !important;
    padding: 0.2rem 0 0 !important;
  }
  .hero > .hero-copy {
    width: 100% !important;
    max-width: 30rem !important;
    padding: 0 !important;
    flex-shrink: 0;
    z-index: 3;
  }
  .hero-badge {
    margin-bottom: 0.25rem;
    padding: 0.2rem 0.65rem;
    font-size: 0.66rem;
  }
  .hero h1 {
    font-size: clamp(1.55rem, min(7vw, 3.7vh), 2.25rem) !important;
    line-height: 1.06 !important;
  }
  .role {
    margin-top: 0.2rem !important;
    font-size: clamp(0.82rem, 1.6vh, 0.98rem) !important;
  }
  .lead {
    margin: 0.2rem auto 0 !important;
    font-size: clamp(0.72rem, 1.35vh, 0.84rem) !important;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .links {
    justify-content: center !important;
    margin-top: 0.45rem !important;
    gap: 0.45rem !important;
  }
  .btn {
    padding: 0.36rem 0.8rem;
    font-size: 0.78rem;
  }
  .hero > .photo {
    flex: 1 1 auto !important;
    width: 100% !important;
    height: 100% !important;
    min-height: 0 !important;
    display: flex !important;
    z-index: 1;
  }
  .cutout::after {
    width: min(74vw, 38dvh);
    bottom: 16%;
  }
  .cutout img {
    position: absolute !important;
    bottom: 9% !important;
    left: 50% !important;
    z-index: 1;
    width: auto !important;
    height: 92% !important;
    max-height: none !important;
    max-width: none !important;
    object-fit: contain !important;
    object-position: bottom center !important;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 84%, rgba(0,0,0,0.45) 94%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 84%, rgba(0,0,0,0.45) 94%, transparent 100%);
    transform-origin: 50% 100% !important;
    transform: translateX(-50%) scale(1.12) !important;
    filter: drop-shadow(0 16px 30px rgba(28, 27, 56, .24));
  }
}
</style>
</head>
